<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            color:aqua;
            background-color:greenyellow;
        }
        p{ font-style: italic;
            font-size: 16px;
            text-decoration: underline;
            text-decoration-color: yellow;
            
        }
        .box{
    
            height: 200px;
            width: 150px;
            background-color: blue;
            border-radius: 200px;
            border-color: black;
            border-style: double;
            border-top: 50px;
            border-width: 5px;
            padding: 100px 50px;

            margin-top: 160px;
            margin-left: 200px;
        }
    </style>
</head>
<body>
    <h1>styling work</h1>
    <p>my name is ali sharjeel</p>
    <div class="box">ali sharjeel</div>
    <script></script>
</body>
</html>
